services:
  - type: worker
    name: song-quiz-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node bot.js
    envVars:
      - key: DISCORD_TOKEN
        sync: false # ダッシュボードで値を入力
      - key: DATABASE_URL
        sync: false # PostgreSQLの接続URLをダッシュボードで入力
      - key: NODE_VERSION
        value: 20
